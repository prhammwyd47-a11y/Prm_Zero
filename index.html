<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

        }

        .hero{

            background:linear-gradient(135deg,#0b3d91,#07111f);
        }

        h1{
            font-size:60px;
            color:#4db8ff;
        }

        p{

        .btn{

            background:#1ea7ff;
            color:white;

            border-radius:10px;
            margin-top:20px;
        }

        .card{
            background:#0d1b2d;
            width:300px;
            margin:20px auto;
            padding:20px;
            border-radius:15px;
        }

<body>

    <div class="card">
